name: Documentação - GitHub Pages

# Gera o site da documentação (tools/gerar_site.py, a partir de docs/tecnica e docs/usuario) e publica no GitHub Pages
# a cada mudança no master que mexe na documentação, no código contado nos números ou no próprio site.
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "site/**"
      - "tools/gerar_site.py"
      - "frontend/app.py"
      - "xano-workspace/**"
      - "openspec/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    name: Gerar e publicar o site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar o site
        run: |
          pip install markdown==3.11.3
          python tools/gerar_site.py --checar
          python tools/gerar_site.py --saida _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
