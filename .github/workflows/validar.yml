name: Validar

# Roda em todo Pull Request e em push no master. Nao fala com o Xano: so confere o
# repositorio (sintaxe do Python, guarda de acesso dos endpoints, tela de entrada do
# frontend e ausencia de segredos).
on:
  pull_request:
  push:
    branches: [master]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias do frontend
        run: pip install -r frontend/requirements.txt

      - name: Sintaxe do Python (frontend e ferramentas)
        run: python -m compileall -q frontend tools

      - name: Guarda de acesso dos endpoints do Xano
        run: python tools/checar_endpoints.py

      - name: Fontes servidas pelo proprio app (sem Google Fonts)
        run: python tools/checar_fontes_locais.py

      - name: Teste de fumaca do frontend
        run: |
          cp .streamlit/secrets.toml.example .streamlit/secrets.toml
          python tools/smoke_frontend.py

      - name: Testes do fluxo de entrada (F01)
        run: python tools/testar_login_f01.py

      - name: Testes do Onboarding
        run: python tools/testar_onboarding.py

      - name: Testes de Privacidade e Documentos
        run: python tools/testar_privacidade_documentos.py

      - name: Testes da conferência de documentos (RH)
        run: python tools/testar_conferencia_documentos.py

      - name: Testes do Meu Perfil
        run: python tools/testar_perfil.py

      - name: Testes do Ponto
        run: python tools/testar_ponto.py

      - name: Testes de Férias
        run: python tools/testar_ferias.py

      - name: Testes de Pagamento
        run: python tools/testar_pagamento.py

      - name: Testes da Central de Pendências e de Ausências
        run: python tools/testar_decisoes.py

      - name: Testes de Colaboradores e de Usuários e perfis
        run: python tools/testar_cadastro.py

      - name: Testes de Solicitações ao RH
        run: python tools/testar_solicitacoes.py

      - name: Testes do espelho de ponto mensal
        run: python tools/testar_ponto_mensal.py

      - name: Testes da folha de ponto e da hierarquia
        run: python tools/testar_folha_ponto.py

      - name: Testes de Benefícios
        run: python tools/testar_beneficios.py

      - name: Testes do REP-P (hash e cadeia) e do comprovante em PDF
        run: |
          python tools/testar_rep_p.py
          python tools/testar_comprovante.py

      - name: Testes do Organograma e do cadastro de cargos
        run: |
          python tools/testar_organograma.py
          python tools/testar_cargos.py

      - name: Testes de Comunicados e FAQ e das notificações
        run: |
          python tools/testar_faq.py
          python tools/testar_notificacoes.py

      - name: Testes das regras de campo (só números, sem emoji)
        run: python tools/testar_campos.py

      - name: Testes da Auditoria
        run: python tools/testar_auditoria.py

      - name: Testes das Regras
        run: python tools/testar_regras.py

      - name: Testes do Desligamento
        run: python tools/testar_desligamento.py

      - name: Testes da pesquisa de clima e da avaliação de desempenho
        run: python tools/testar_clima_avaliacao.py

      - name: Testes dos Pedidos LGPD
        run: python tools/testar_pedidos_lgpd.py

      - name: Testes de Integrações e e-mails
        run: python tools/testar_integracoes.py

      - name: Testes do Canal de denúncias
        run: python tools/testar_denuncias.py

      - name: Testes da Trajetória
        run: python tools/testar_trajetoria.py

      - name: Testes do ciclo de metas
        run: python tools/testar_ciclo_metas.py

      - name: Testes de Configurações (Segurança e Notificações)
        run: python tools/testar_configuracoes.py

      - name: Procurar segredos no repositorio
        run: |
          if git grep -n -E "xkeysib-[A-Za-z0-9]{20,}|SG\.[A-Za-z0-9_-]{20,}|Bearer eyJ[A-Za-z0-9_-]{20,}" -- . ':!.github'; then
            echo "Possivel segredo versionado."; exit 1
          fi
