<!--
  conectaRH — Template base reutilizável (SendGrid Dynamic Template)
  =====================================================================
  Como usar:
  1. Cole este HTML completo no "Code Editor" da versão do seu Dynamic
     Template no SendGrid.
  2. Troque {{logo_url}} por uma URL pública dos arquivos em
     /email-assets (hospede-os no seu site, S3, Cloudinary etc.) —
     use logo-email-white.png (fundo escuro) ou logo-email-dark.png
     (fundo claro).
  3. Edite apenas o bloco entre "CONTEÚDO — INÍCIO" e "CONTEÚDO — FIM"
     para criar novos e-mails a partir deste shell.
  4. Variáveis Handlebars usadas neste bloco de exemplo:
     {{first_name}}, {{heading}}, {{body_text}}, {{cta_url}}, {{cta_label}}
  5. {{unsubscribe_url}} deve ser preenchido pelo seu backend/SendGrid
     (link de descadastro obrigatório em e-mails de marketing).
-->
<!doctype html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>conectaRH</title>
<!--[if mso]>
<noscript>
<xml>
<o:OfficeDocumentSettings>
<o:PixelsPerInch>96</o:PixelsPerInch>
</o:OfficeDocumentSettings>
</xml>
</noscript>
<![endif]-->
<style>
  body, table, td { font-family: 'Manrope', Arial, Helvetica, sans-serif; }
  body { margin: 0; padding: 0; background-color: #F5F3FF; -webkit-text-size-adjust: 100%; }
  table { border-collapse: collapse; }
  img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
  a { color: #6D28D9; }
  @media only screen and (max-width: 600px) {
    .container { width: 100% !important; }
    .stack { padding-left: 24px !important; padding-right: 24px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background-color:#F5F3FF;">
<!-- Preheader (oculto, aparece na pré-visualização do e-mail) -->
<div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all;">
  {{preheader_text}}
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F3FF;">
  <tr>
    <td align="center" style="padding:32px 16px;">

      <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:600px; background-color:#FFFFFF; border-radius:16px; overflow:hidden;">

        <!-- Cabeçalho -->
        <tr>
          <td align="center" bgcolor="#0B0B14" style="background-color:#0B0B14; padding:32px 40px;">
            <img src="{{logo_url}}" width="150" alt="conectaRH" style="display:block; height:auto; max-width:150px;">
          </td>
        </tr>

        <!-- ===================== CONTEÚDO — INÍCIO ===================== -->
        <tr>
          <td class="stack" style="padding:48px 40px 16px;">
            <h1 style="margin:0 0 16px; font-family:'Sora', Arial, sans-serif; font-weight:700; font-size:24px; line-height:1.3; color:#0B0B14;">
              {{heading}}
            </h1>
            <p style="margin:0 0 24px; font-family:'Manrope', Arial, sans-serif; font-size:15px; line-height:1.6; color:#5B5568;">
              Ol&aacute; {{first_name}}, {{body_text}}
            </p>

            <!-- Botão (bulletproof) -->
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" bgcolor="#6D28D9" style="background-color:#6D28D9; border-radius:8px;">
                  <a href="{{cta_url}}" target="_blank" style="display:inline-block; padding:14px 28px; font-family:'Manrope', Arial, sans-serif; font-weight:700; font-size:15px; color:#FFFFFF; text-decoration:none;">
                    {{cta_label}}
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr><td class="stack" style="padding:16px 40px 48px;"><div style="border-top:1px solid #ECEAF5;"></div></td></tr>
        <!-- ===================== CONTEÚDO — FIM ===================== -->

        <!-- Rodapé -->
        <tr>
          <td align="center" bgcolor="#F5F3FF" style="background-color:#F5F3FF; padding:28px 40px;">
            <p style="margin:0 0 8px; font-family:'Manrope', Arial, sans-serif; font-size:12px; line-height:18px; color:#8A8598;">
              conectaRH &middot; Conectando pessoas e oportunidades
            </p>
            <p style="margin:0; font-family:'Manrope', Arial, sans-serif; font-size:12px; line-height:18px; color:#8A8598;">
              <a href="{{unsubscribe_url}}" style="color:#6D28D9; text-decoration:underline;">Cancelar inscri&ccedil;&atilde;o</a>
              &nbsp;&middot;&nbsp;
              <a href="{{preferences_url}}" style="color:#6D28D9; text-decoration:underline;">Preferências de e-mail</a>
            </p>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>
</body>
</html>
